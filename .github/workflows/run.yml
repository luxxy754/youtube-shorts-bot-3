name: Auto Generate and Post YouTube Shorts

on:
  schedule:
    # US trending hours ke hisaab se 2 runs (PKT = UTC+5):
    #   Run A: 11:00 UTC = 16:00 PKT = 6:00 AM ET  (US morning trending)
    #   Run B: 23:00 UTC = 04:00 PKT = 6:00 PM ET  (US evening prime time, previous day)
    - cron: '0 11 * * *'    # Run A -> Slot A (US morning)
    - cron: '0 23 * * *'    # Run B -> Slot B (US evening)
  workflow_dispatch:
    inputs:
      publish_now:
        description: 'Manual test: schedule ke bajaye foran public upload'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      timeout-minutes: 15
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt || true
        sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"

        for i in 1 2 3; do
          sudo apt-get $APT_OPTS update && break
          echo "apt-get update failed (attempt $i), retrying..."
          sleep 10
        done

        sudo apt-get $APT_OPTS install -y --no-install-recommends \
          ffmpeg \
          imagemagick \
          libjpeg-dev \
          zlib1g-dev \
          libpng-dev \
          libfreetype6-dev \
          fonts-deva \
          fonts-noto \
          fonts-noto-color-emoji \
          fonts-dejavu \
          fonts-dejavu-core \
          fonts-liberation \
          fontconfig
        sudo fc-cache -f

    - name: Fix ImageMagick Policy
      run: |
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/policy domain="coder" rights="none" pattern="PDF"/policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
        convert -version || magick -version || echo "ImageMagick check failed"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify Fonts + ImageMagick
      run: |
        echo "=== DejaVu fonts ==="
        ls -la /usr/share/fonts/truetype/dejavu/ || echo "DejaVu fonts not found"
        echo "=== Liberation fonts ==="
        ls -la /usr/share/fonts/truetype/liberation/ || echo "Liberation fonts not found"
        echo "=== fc-list check ==="
        fc-list | grep -i "dejavu\|liberation" | head -5
        echo "=== ImageMagick check ==="
        which convert || which magick || echo "ImageMagick NOT FOUND"

    - name: Run Auto-Generation & Auto-Posting Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
        YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
        YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        YOUTUBE_PLAYLIST_ID_2: ${{ secrets.YOUTUBE_PLAYLIST_ID_2 }}
        YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
        YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
        YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
        YOUTUBE_PLAYLIST_ID_3: ${{ secrets.YOUTUBE_PLAYLIST_ID_3 }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        WORD_CAPTIONS: '1'
        ENABLE_CAPTIONS: '0'
        CAPTION_WORDS: '2'
        LOOP_VIDEO: '1'
        SCHEDULE_CRON: ${{ github.event.schedule }}
        PUBLISH_NOW: ${{ github.event.inputs.publish_now }}
        HOOK_CAPTION: '1'
        TTS_VOICE: 'en-US-AndrewNeural'
        TTS_RATE: '+6%'
      run: python main.py

    - name: Commit used_topics.json back to repo
      if: always()
      run: |
        if [ -f used_topics.json ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used_topics [skip ci]"
          git pull --rebase || true
          git push || echo "Push failed, skipping"
        fi

    - name: Notify failure on Telegram
      if: failure()
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ AutoShorts pipeline failed on run ${{ github.run_id }}. Check logs."
        fi
