name: Auto Generate and Post YouTube Shorts

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 7 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # 60 se 120 kar diya (2 channels ke liye)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          imagemagick \
          libjpeg-dev \
          zlib1g-dev \
          libpng-dev \
          libfreetype6-dev \
          fonts-deva \
          fonts-noto \
          fonts-noto-color-emoji \
          fonts-dejavu \
          fonts-dejavu-core \
          fonts-liberation \
          fontconfig
        sudo fc-cache -f -v

    - name: Fix ImageMagick Policy
      run: |
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/policy domain="coder" rights="none" pattern="PDF"/policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
        convert -version || magick -version || echo "ImageMagick check failed"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify Fonts + ImageMagick
      run: |
        echo "=== DejaVu fonts ==="
        ls -la /usr/share/fonts/truetype/dejavu/ || echo "DejaVu fonts not found"
        echo "=== Liberation fonts ==="
        ls -la /usr/share/fonts/truetype/liberation/ || echo "Liberation fonts not found"
        echo "=== fc-list check ==="
        fc-list | grep -i "dejavu\|liberation" | head -5
        echo "=== ImageMagick check ==="
        which convert || which magick || echo "ImageMagick NOT FOUND"

    - name: Run Auto-Generation & Auto-Posting Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
        YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
        YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        YOUTUBE_PLAYLIST_ID_2: ${{ secrets.YOUTUBE_PLAYLIST_ID_2 }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        WORD_CAPTIONS: '0'     # 1 se 0 kar diya (captions off, speed tez)
        ENABLE_CAPTIONS: '0'
        HOOK_CAPTION: '1'
        TTS_VOICE: 'hi-IN-MadhurNeural'
        TTS_RATE: '+8%'
      run: python main.py

    - name: Commit used_topics.json back to repo
      if: always()
      run: |
        if [ -f used_topics.json ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used_topics [skip ci]"
          git pull --rebase || true
          git push || echo "Push failed, skipping"
        fi

    - name: Notify failure on Telegram
      if: failure()
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ AutoShorts pipeline failed on run ${{ github.run_id }}. Check logs."
        fi
